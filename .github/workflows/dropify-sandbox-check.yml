name: Dropify sandbox checkout check

on:
  pull_request:
    paths:
      - "web/apps/dropify/**"
      - "web/pnpm-lock.yaml"
      - ".github/workflows/dropify-sandbox-check.yml"
  workflow_dispatch:

jobs:
  build-dropify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_WHOP_ENVIRONMENT: sandbox
      NEXT_PUBLIC_WHOP_COMPANY_ID: biz_sandbox_placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:5007
      WHOP_API_KEY: sk_test_placeholder
      AUTH_SECRET: sandbox-check-only
      WHOP_CLIENT_SECRET: sandbox-check-only
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter dropify build
