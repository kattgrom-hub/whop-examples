name: Dropify checkout checks
on:
  pull_request:
    paths: ['web/apps/**', 'web/packages/auth/**', 'web/packages/webhooks/**', 'web/pnpm-lock.yaml', '.github/workflows/dropify-checkout.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm --filter @whop-examples/webhooks test
        working-directory: web
      - run: pnpm --filter dropify test
        working-directory: web
      - run: pnpm --filter whop-webhooks test
        working-directory: web
      - run: pnpm --filter whop-webhooks build
        working-directory: web
      - run: pnpm --filter dropify build
        working-directory: web
        env:
          NEXT_PUBLIC_WHOP_ENVIRONMENT: sandbox
      - name: Install Chromium for payment UI checks
        run: pnpm --filter dropify exec playwright install --with-deps chromium
        working-directory: web
      - name: Verify sandbox Elements flow (mocked provider)
        run: node tests/payment-element-browser.mjs
        working-directory: web/apps/dropify
        env:
          DROPIFY_TEST_START: '1'
      - name: Verify hosted checkout fallback
        run: node tests/payment-element-browser.mjs
        working-directory: web/apps/dropify
        env:
          DROPIFY_TEST_START: '1'
          DROPIFY_TEST_HOSTED: '1'
